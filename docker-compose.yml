services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-arena_local_pw}
      MYSQL_DATABASE: goldbyte_db
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASS:-arena_local_pw}"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/goldbyte_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASS: ${DB_PASS:-arena_local_pw}
    depends_on:
      db:
        condition: service_healthy
volumes:
  dbdata:
